[build-system]
requires = [
    "setuptools>=80",
    "setuptools_scm",
]
build-backend = "setuptools.build_meta"

[project]
name            = "stawp"
description     = "STAtic Website Producer"
license         = { text = "MIT" }
authors         = [{name = "Matt Wisniewski", email = "stawp@mattw.life"}]
requires-python = ">=3.10.0"
classifiers     = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = [
    "static",
    "website",
]
dependencies = [
    "Pillow~=11.3",
    "pyaml~=25.7",
    "click~=8.2",
]
dynamic = ["version"]

[project.scripts]
stawp = "stawp.cli:cli"

[project.urls]
homepage = "https://github.com/polishmatt/stawp/"

[project.optional-dependencies]
tests = ["pytest"]

[tool.setuptools.packages.find]
include = ["stawp*"]

[tool.setuptools_scm]
write_to = "stawp/__init__.py"

[tool.pytest.ini_options]
minversion  = "8.4"
testpaths   = ["tests"]
